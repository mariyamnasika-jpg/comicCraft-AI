<!DOCTYPE html>
<html>
<head>
  <title>ComicCraft - AI Comic Creator</title>
  <style>
    body { font-family: Arial; background: #f5f5f5; display:flex; justify-content:center; flex-direction: column; align-items: center; }
    form { background:white; padding:30px; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.1); width:400px; }
    input, textarea, select { width:100%; padding:10px; margin-top:5px; border-radius:5px; border:1px solid #ccc; box-sizing: border-box; }
    button { background:black; color:white; padding:12px; width:100%; border-radius:8px; cursor:pointer; margin-top:10px;}
  </style>
</head>
<body>
  <h1>ComicCraft - AI Comic Story Creator</h1>
  <form action="/generate" method="POST">
    <label>Story Prompt:</label><br>
    <textarea name="story_prompt" required>Hero Chennai la villain ah adikuraan</textarea><br><br>

    <label>Main Character Name:</label><br>
    <input type="text" name="character_name" value="Sugan"><br><br>

    <label>Story Tone:</label><br>
    <select name="story_tone">
      <option selected>Dramatic</option>
      <option>Funny</option>
      <option>Action</option>
    </select><br><br>

    <label>Art Style:</label><br>
    <select name="art_style">
      <option>Marvel Style</option>
      <option>Anime Style</option>
    </select><br><br>

    <button type="submit">Generate Comic</button>
  </form>
</body>
</html>
