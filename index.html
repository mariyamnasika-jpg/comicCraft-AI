<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComicCraft AI - No Image</title>
<style>
body{background:#1e1e2f;color:white;font-family:Arial;padding:20px;text-align:center}
input{width:90%;padding:12px;margin:8px;border-radius:10px;border:none;font-size:16px}
button{width:92%;padding:14px;background:linear-gradient(90deg,#ff4d9e,#ff8a3d);border:none;border-radius:12px;color:white;font-size:18px;font-weight:bold;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.panel{background:#2a2a40;border-radius:12px;padding:15px;min-height:120px;text-align:left;border-left:4px solid #ff4d9e}
.panel h3{margin:0 0 10px 0;color:#ff8a3d}
</style>
</head>
<body>
<h1>🎨 ComicCraft AI 🎨</h1>
<input id="story" placeholder="Un story type pannu" value="Hero Chennai la villain ah adikaran">
<input id="setting" value="Marina Beach at sunset">
<button onclick="generate()">🔥 Generate Comic Story 🔥</button>
<div class="grid">
<div class="panel" id="p1"><h3>Panel 1</h3><p>Click Generate</p></div>
<div class="panel" id="p2"><h3>Panel 2</h3><p>Click Generate</p></div>
<div class="panel" id="p3"><h3>Panel 3</h3><p>Click Generate</p></div>
<div class="panel" id="p4"><h3>Panel 4</h3><p>Click Generate</p></div>
</div>
<script>
function generate(){
let s=document.getElementById('story').value;
let set=document.getElementById('setting').value;
document.getElementById('p1').innerHTML="<h3>Panel 1 - Start</h3><p>📍 "+set+"<br><br>🦸 "+s+" - Hero entry mass ah irukku!</p>";
document.getElementById('p2').innerHTML="<h3>Panel 2 - Conflict</h3><p>😈 Villain varan! Marina la sandai start aaguthu! Rendu perum fight ku ready!</p>";
document.getElementById('p3').innerHTML="<h3>Panel 3 - Action</h3><p>💥 BOOM! Power full fight! Hero villain ah strong ah adikaran!</p>";
document.getElementById('p4').innerHTML="<h3>Panel 4 - Victory</h3><p>🏆 Hero wins! Chennai beach la ellarum hero va celebrate panranga! The End!</p>";
}
</script>
</body>
</html>
