<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComicCraft AI - Real Comic Generator</title>
<style>
body{font-family:Arial;background:#0f0f0f;color:white;display:flex;justify-content:center;padding:10px}
.card{background:#1e1e1e;padding:25px;border-radius:15px;width:100%;max-width:900px;box-shadow:0 8px 30px rgba(0,0,0,0.5)}
input,select{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:none}
button{width:100%;padding:12px;background:linear-gradient(90deg,#ff0066,#ff6600);border:none;border-radius:10px;color:white;font-weight:bold;cursor:pointer;font-size:16px}
#result{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{background:#2a2a2a;border-radius:10px;overflow:hidden;text-align:center;padding-bottom:5px;min-height:250px}
.panel img{width:100%;height:200px;object-fit:cover}
.panel p{font-size:12px;padding:5px}
</style>
</head>
<body>
<div class="card">
<h2 style="text-align:center">🎨 ComicCraft AI 🎨</h2>
<label>Story Prompt</label>
<input id="story" placeholder="Hero Chennai la villain ah adikaran" value="Hero Chennai la villain ah adikaran">
<label>Setting</label>
<input id="setting" value="Marina Beach at sunset, cinematic">
<label>Style</label>
<select id="style"><option>Dramatic comic book style</option><option>Anime</option><option>Realistic</option></select>
<button onclick="generate()">🔥 Generate Comic 🔥</button>
<div id="result">
<div class="panel" id="p1"><p>Panel 1</p></div>
<div class="panel" id="p2"><p>Panel 2</p></div>
<div class="panel" id="p3"><p>Panel 3</p></div>
<div class="panel" id="p4"><p>Panel 4</p></div>
</div>
</div>
<script>
function generate(){
 const story=document.getElementById('story').value;
 const setting=document.getElementById('setting').value;
 const style=document.getElementById('style').value;
 for(let i=1;i<=4;i++){
   const prompt = `${story}, ${setting}, ${style}, comic panel ${i}`;
   const seed = Math.floor(Math.random()*999999);
   const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&nologo=true&width=512&height=512&model=flux`;
   document.getElementById('p'+i).innerHTML = `<img src="${url}" onload="this.style.opacity=1"><p>Panel ${i}</p>`;
 }
}
</script>
</body>
</html>
